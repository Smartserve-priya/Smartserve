<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointment Confirmed - SmartServe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
        <img src="logo.png" alt="SmartServe Logo">
            Smart<span>Serve</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="appointment.html">Book Appointment</a>
            <a href="my-appointment.html">My Appointment</a>
        </nav>

    </header>


    <!-- CONFIRMATION SECTION -->

    <section class="confirmation">

        <div class="success-box">

            <!-- Success Icon -->

            <div class="success-icon">
                ✓
            </div>


            <h1>
                Appointment Confirmed!
            </h1>

            <p>
                Your appointment has been successfully booked.
            </p>


            <!-- Appointment Details -->

            <div
                id="appointmentDetails"
                class="details-box">
            </div>


            <!-- Buttons -->

            <div class="confirmation-buttons">

                <a
                    href="my-appointment.html"
                    class="main-btn">
                    View My Appointment
                </a>

                <a
                    href="index.html"
                    class="secondary-btn">
                    Back to Home
                </a>

            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->

    <script>

        // Get appointment data

        const data = JSON.parse(
            localStorage.getItem(
                "smartServeAppointment"
            )
        );


        const box =
            document.getElementById(
                "appointmentDetails"
            );


        // If appointment exists

        if (data) {

            box.innerHTML = `

                <h3>Appointment Details</h3>

                <p>
                    <strong>Name:</strong>
                    ${data.name}
                </p>

                <p>
                    <strong>Mobile:</strong>
                    ${data.mobile}
                </p>

                <p>
                    <strong>Service:</strong>
                    ${data.type}
                </p>

                <p>
                    <strong>Date:</strong>
                    ${data.date}
                </p>

                <p>
                    <strong>Time:</strong>
                    ${data.time}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span class="confirmed">
                        Confirmed ✓
                    </span>
                </p>

            `;

        }

        // If no appointment found

        else {

            box.innerHTML = `
                <p>
                    No appointment details found.
                </p>
            `;

        }

    </script>

</body>

</html>
